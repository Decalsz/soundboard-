name: Build SCI-FI SOUNDBOARD STUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: unzip -q SCI-FI-SOUNDBOARD-STUDIO-source.zip
        
      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > SCI-FI-SOUNDBOARD-STUDIO/gradle.properties
          echo "android.enableJetifier=true" >> SCI-FI-SOUNDBOARD-STUDIO/gradle.properties
          
      - name: Download Gradle
        run: |
          curl -L --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"

      - name: Build APK
        working-directory: SCI-FI-SOUNDBOARD-STUDIO/app
        run: $HOME/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SCI-FI-SOUNDBOARD-STUDIO-APK
          path: SCI-FI-SOUNDBOARD-STUDIO/app/build/outputs/apk/debug/app-debug.apk
